<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsubscribe · TenderPilot</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&display=swap">
<style>
:root{--bg:#070A12;--ink:#F5F7FA;--soft:#A0ABBA;--line:rgba(245,247,250,.09);--glass:rgba(245,247,250,.04);--amber:#F7AC3B}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif}
.box{width:100%;max-width:460px;background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:28px}
h1{font-family:"Space Grotesk",sans-serif;font-size:26px;margin:0 0 6px}
p{color:var(--soft)}
input{font:inherit;width:100%;color:var(--ink);background:rgba(7,10,18,.6);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0 16px}
button{font:600 16px "Space Grotesk",sans-serif;background:var(--amber);color:#090C16;border:0;border-radius:999px;padding:12px 24px;cursor:pointer}
a{color:var(--soft)}
</style>
</head>
<body>
<div class="box">
  <form id="f">
    <h1>Stop the daily emails</h1>
    <p>We'll stop sending tender emails to this address from the next morning.</p>
    <label>Email<input id="email" name="email" type="email" required></label>
    <button type="submit">Unsubscribe</button>
    <p id="err" style="color:#FF8A7A"></p>
  </form>
  <div id="done" style="display:none"><h1>Done</h1><p>You won't get any more emails from TenderPilot. <a href="/">Back to TenderPilot</a></p></div>
</div>
<script>
const q=new URLSearchParams(location.search);if(q.get("email"))document.getElementById("email").value=q.get("email");
const f=document.getElementById("f");
f.addEventListener("submit",async e=>{e.preventDefault();
  try{const r=await fetch("/api/unsubscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:f.email.value})});
    if(!r.ok)throw new Error("Couldn't save that. Please try again.");
    f.style.display="none";document.getElementById("done").style.display="block"}
  catch(x){document.getElementById("err").textContent=x.message}});
</script>
</body>
</html>
