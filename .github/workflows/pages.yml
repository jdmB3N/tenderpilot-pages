# The site is hosted on Cloudflare Pages, which rebuilds on every push to main.
# This workflow pushes a tiny "rebuild" commit every day so the tender pages stay fresh.
# (GitHub Pages keeps serving its last version until it's switched off.)
name: Daily rebuild on Cloudflare
on:
  schedule:
    - cron: "15 6 * * *"   # every day 06:15 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          date -u +"%Y-%m-%d %H:%M UTC" > last-rebuild.txt
          git config user.name "tenderpilot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add last-rebuild.txt
          git commit -m "Daily rebuild" && git push
