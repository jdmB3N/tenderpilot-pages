# Rebuilds the public tender pages every day and publishes them free on GitHub Pages.
# No keys: all data is public (TED, the EU's official tender database).
name: Build tender pages
on:
  schedule:
    - cron: "15 6 * * *"   # every day 06:15 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install httpx
      - id: pages
        uses: actions/configure-pages@v5
      - run: python build.py
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
